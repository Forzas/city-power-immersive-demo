<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市供水系统</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>探寻一滴水的城市旅程</h1>
        <p>从水源到家庭，再回到自然，了解城市供水的全过程。</p>
    </header>
    <main>
        <section id="water-system-visual">
            <svg width="800" height="600" id="water-flow">
                <!-- Example water flow animation -->
                <circle cx="100" cy="100" r="30" fill="blue" id="source" class="water-node"></circle>
                <line x1="100" y1="100" x2="400" y2="300" stroke="blue" stroke-width="5" class="water-pipe"></line>
<line x1="400" y1="300" x2="500" y2="350" stroke="lightblue" stroke-width="4" class="secondary-supply-flow"></line>
                <circle cx="400" cy="300" r="20" fill="green" class="water-consumer"></circle>
            </svg>
        </section>
        <section id="education-insights">
            <h2>了解城市供水的关键知识</h2>
            <ul>
                <li>为什么水源需要多重净化？</li>
                <li>城市供水如何应对高峰需求？</li>
            </ul>
        </section>
    </main>
</body>
</html>
