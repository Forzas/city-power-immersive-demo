<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>垃圾分类科普</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>垃圾分类科普</h1>
    <p>了解垃圾分类背后的复杂流程：从分类到转运、处理和资源再利用。</p>
  </header>

  <main>
    <section>
      <h2>不同垃圾的归宿</h2>
      <p>选择一种垃圾类型，探索它的旅程：</p>
      <ul>
        <li>厨余垃圾</li>
        <li>可回收垃圾</li>
        <li>有害垃圾</li>
        <li>其他垃圾</li>
      </ul>
    </section>

    <section>
      <h2>操作模式</h2>
      <p>查看系统如何应对以下场景：</p>
      <ul>
        <li>正常分类日</li>
        <li>高错误率处理</li>
        <li>假期高峰</li>
      </ul>
    </section>

    <section>
      <h2>科普互动</h2>
      <p>通过点击和图示了解垃圾分类每一步的处理方式。</p>
    </section>
  </main>

  <footer>
    <p>沉浸式学习项目 - 垃圾分类专题</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
